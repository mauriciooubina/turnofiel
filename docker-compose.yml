version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pfi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pfi_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Definir DB_PASS en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pfi_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - HELLFISH_SALT=${HELLFISH_SALT:?Definir HELLFISH_SALT en .env}
      - HOOLIGANS_SALT=${HOOLIGANS_SALT:?Definir HOOLIGANS_SALT en .env}
      - DATA_SOURCE=POSTGRES
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pfi_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:?Definir DB_PASS en .env}
      - JWT_SECRET=${JWT_SECRET:?Definir JWT_SECRET en .env}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:

